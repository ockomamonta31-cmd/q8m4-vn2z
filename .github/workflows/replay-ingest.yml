name: Replay timelines

on:
  schedule:
    - cron: '*/5 * * * *'
  # Cloudflare Cron Trigger на воркере будит парсер здесь: планировщик GitHub
  # этому репозиторию запуски по schedule не отдаёт.
  repository_dispatch:
    types: [replay-backfill]
  workflow_dispatch:
    inputs:
      match_id:
        description: 'Match ID to parse now, comma separated (empty = pending batch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: replay-ingest
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPLAY_INGEST_URL: ${{ secrets.REPLAY_INGEST_URL }}
      REPLAY_INGEST_TOKEN: ${{ secrets.REPLAY_INGEST_TOKEN }}
      # Из repository_dispatch берём только числовой лимит и проходим его через
      # env: payload GitHub считает данными, которыми теоретически может
      # управлять чужой код. Список матчей раннер читает сам из своего API.
      REPLAY_MATCHES_PER_RUN: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.limit || '5' }}
      REPLAY_SCAN_LIMIT: 40
      REPLAY_MATCH_ID: ${{ inputs.match_id }}
      DOTA_PARSER_URL: http://127.0.0.1:5600
      REPLAY_SPATIAL_CONTAINER: replay-parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start replay parser
        run: |
          docker run -d --name replay-parser -p 5600:5600 odota/parser:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5600/healthz; then exit 0; fi
            sleep 2
          done
          docker logs replay-parser
          exit 1
      - name: Preserve hero trajectories and combat events
        run: |
          docker cp server/gc/SpatialReplay.java replay-parser:/tmp/SpatialReplay.java
          docker exec replay-parser javac -proc:none -cp /usr/src/parser/target/stats-0.1.0.jar -d /tmp/spatial /tmp/SpatialReplay.java
      - run: npm run replay:github
